<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Know It's Wrong</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.2rem;
            text-align: center;
        }

        video,
        audio {
            display: block;
            margin: 0 auto;
            outline: none;
        }
    </style>
</head>

<body>
    <h1>You Know It's Wrong , please Stop</h1>
    <div id="media-container"></div>

    <script>
        const VIDEO_URL = "./VID_20260410_081131_014.mp4";
        const AUDIO_URL = "./VID_20260410_081131_014.mp3";
        const PLAYBACK_RATE = 0.75;

        function tryClose() {
            window.open('', '_self', '');
            window.close();
        }

        function playAudioFallback() {
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            const audio = document.createElement('audio');
            audio.src = AUDIO_URL;
            audio.controls = false;
            audio.style.display = 'none';
            audio.addEventListener('canplay', () => {
                audio.playbackRate = PLAYBACK_RATE;
            });
            audio.addEventListener('ratechange', () => {
                if (audio.playbackRate !== PLAYBACK_RATE) audio.playbackRate = PLAYBACK_RATE;
            });
            audio.addEventListener('ended', tryClose);
            container.appendChild(audio);
            audio.load();
            audio.play().catch(() => { });
        }

        function playVideo() {
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            const video = document.createElement('video');
            video.controls = false;
            video.muted = false;
            video.playsInline = true;
            video.preload = 'none';
            video.style.maxWidth = '90vw';
            video.style.maxHeight = '60vh';
            video.setAttribute('disablePictureInPicture', '');
            video.setAttribute('tabindex', '-1');
            video.setAttribute('playsinline', '');

            // Enforce fixed playback rate
            video.addEventListener('canplay', () => {
                video.playbackRate = PLAYBACK_RATE;
            });
            video.addEventListener('ratechange', () => {
                if (video.playbackRate !== PLAYBACK_RATE) video.playbackRate = PLAYBACK_RATE;
            });
            // Prevent right-click/context menu
            video.addEventListener('contextmenu', e => e.preventDefault());
            // Prevent pausing — immediately resume if paused
            video.addEventListener('pause', () => {
                video.play().catch(() => { });
            });
            // On load error, fallback to audio
            video.addEventListener('error', playAudioFallback);
            // On end, try to close
            video.addEventListener('ended', tryClose);

            container.appendChild(video);
            // Lazy load: assign src now, then trigger load + play
            video.src = VIDEO_URL;
            video.load();
            video.play().catch(() => { });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(playVideo, 1500);
        });
    </script>
</body>

</html>
